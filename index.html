<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بازی چرخ شانس</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Tahoma,sans-serif;background:linear-gradient(135deg,#21134b,#542477,#a13b78);color:white;text-align:center;min-height:100vh;padding:22px}
h1{font-size:30px;margin:12px}
p{color:#f9e8ff}
.container{max-width:520px;margin:auto;background:#ffffff18;border:1px solid #ffffff44;border-radius:25px;padding:20px}
input,textarea{width:100%;padding:13px;border:0;border-radius:12px;font-size:16px;margin:8px 0;font-family:inherit}
textarea{height:95px}
button{border:0;border-radius:13px;padding:13px 20px;font-size:17px;font-weight:bold;cursor:pointer;background:#ffd34e;color:#42204d;margin:7px}
button:active{transform:scale(.97)}
.wheelbox{position:relative;width:min(82vw,340px);height:min(82vw,340px);margin:25px auto}
canvas{width:100%;height:100%;border-radius:50%;box-shadow:0 0 25px #0008}
.pointer{position:absolute;top:-13px;left:50%;transform:translateX(-50%);z-index:2;border-left:17px solid transparent;border-right:17px solid transparent;border-top:35px solid #fff}
#result{font-size:23px;font-weight:bold;color:#ffe36b;min-height:38px;margin:15px}
</style>
</head>
<body>
<h1>🎡 چرخ شانس 🎡</h1>
<p>نام‌ها را وارد کن و چرخ را بچرخان!</p>
<div class="container">
<textarea id="names">علی
مریم
زهرا
محمد
فاطمه
رضا</textarea>
<button onclick="makeWheel()">ساخت چرخ</button>
<div class="wheelbox">
<div class="pointer"></div>
<canvas id="wheel" width="600" height="600"></canvas>
</div>
<button onclick="spin()" id="spinBtn">🎯 بچرخان!</button>
<div id="result">منتظر انتخاب برنده هستیم...</div>
</div>
<script>
const canvas=document.getElementById('wheel');
const ctx=canvas.getContext('2d');
let names=[],rotation=0,busy=false;
const colors=['#ff6384','#ffbd59','#56cfe1','#8ac926','#b388eb','#ff924c','#4d96ff','#f15bb5'];
function makeWheel(){
names=document.getElementById('names').value.split(/\n|,/).map(x=>x.trim()).filter(Boolean);
if(names.length<2){alert('حداقل دو نام وارد کنید');return}
rotation=0;
draw();
document.getElementById('result').textContent='چرخ آماده است! 🌟';
}
function draw(){
let n=names.length;
if(!n)return;
let arc=Math.PI*2/n;
ctx.clearRect(0,0,600,600);
names.forEach((name,i)=>{
let start=rotation+i*arc-Math.PI/2;
ctx.beginPath();ctx.moveTo(300,300);
ctx.arc(300,300,290,start,start+arc);
ctx.closePath();ctx.fillStyle=colors[i%colors.length];ctx.fill();
ctx.strokeStyle='white';ctx.lineWidth=4;ctx.stroke();
ctx.save();ctx.translate(300,300);ctx.rotate(start+arc/2);
ctx.textAlign='right';ctx.fillStyle='#24133c';
ctx.font='bold 25px Tahoma';ctx.fillText(name,265,9);
ctx.restore();
});
ctx.beginPath();ctx.arc(300,300,38,0,Math.PI*2);
ctx.fillStyle='white';ctx.fill();
ctx.fillStyle='#542477';ctx.font='bold 23px Tahoma';
ctx.textAlign='center';ctx.fillText('شانس',300,308);
}
function spin(){
if(busy||names.length<2)return;
busy=true;
document.getElementById('spinBtn').disabled=true;
let start=rotation;
let extra=(Math.PI*2)*(5+Math.random()*5)+Math.random()*Math.PI*2;
let duration=4500;
let t0=performance.now();
function animate(now){
let t=Math.min((now-t0)/duration,1);
let ease=1-Math.pow(1-t,4);
rotation=start+extra*ease;
draw();
if(t<1){requestAnimationFrame(animate)}
else{
busy=false;
document.getElementById('spinBtn').disabled=false;
let arc=2*Math.PI/names.length;
let angle=((Math.PI*1.5-rotation)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);
let index=Math.floor(angle/arc)%names.length;
document.getElementById('result').textContent='🎉 برنده: '+names[index]+' 🎉';
}
}
requestAnimationFrame(animate);
}
makeWheel();
</script>
</body>
</html>
